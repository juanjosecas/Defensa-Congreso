name: CI

on:
  push:
    branches:
      - main
      - web-phaser
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

  required:
    name: CI Required
    if: always()
    needs:
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify web build
        run: |
          if [[ "${{ needs.web.result }}" != "success" ]]; then
            echo "Web CI failed."
            exit 1
          fi
          echo "Web CI passed."
